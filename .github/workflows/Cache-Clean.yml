name: Cache-Clean

on:
  #自动清理：每天晚上 23:00 运行
  schedule:
    - cron: '0 23 * * *'
      timezone: "Asia/Shanghai"
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
